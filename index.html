<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>山野之间 · 自然之息</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    /* ===== 基础重置 ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    body {
      background: #f4f7f2;
      color: #2f3e2f;
      line-height: 1.6;
    }

    /* ===== 顶部英雄区 ===== */
    .hero {
      height: 100vh;
      background:
        linear-gradient(
          to bottom,
          rgba(34, 49, 34, 0.35),
          rgba(34, 49, 34, 0.6)
        ),
        url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1920&q=80")
        center / cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: #ffffff;
      padding: 0 20px;
    }

    .hero h1 {
      font-size: clamp(2.4rem, 5vw, 4rem);
      letter-spacing: 0.15em;
      margin-bottom: 16px;
    }

    .hero p {
      font-size: 1.15rem;
      opacity: 0.9;
      max-width: 520px;
    }

    /* ===== 内容区域 ===== */
    .section {
      max-width: 1100px;
      margin: auto;
      padding: 80px 24px;
    }

    .section h2 {
      font-size: 2rem;
      margin-bottom: 32px;
      text-align: center;
      position: relative;
    }

    .section h2::after {
      content: "";
      width: 60px;
      height: 3px;
      background: #6b8f71;
      display: block;
      margin: 12px auto 0;
      border-radius: 2px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      transition: transform 0.3s ease;
    }

    .card:hover {
      transform: translateY(-6px);
    }

    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .card-body {
      padding: 20px;
    }

    .card-body h3 {
      margin-bottom: 10px;
      font-size: 1.2rem;
    }

    .card-body p {
      font-size: 0.95rem;
      color: #555;
    }

    /* ===== 页脚 ===== */
    footer {
      text-align: center;
      padding: 40px 20px;
      background: #2f3e2f;
      color: #cfdac6;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>

  <!-- 英雄区 -->
  <header class="hero">
    <h1>山野之间</h1>
    <p>在风声、叶落与溪流中，找回与自然同频的呼吸。</p>
  </header>

  <!-- 内容区 -->
  <section class="section">
    <h2>感受自然</h2>
    <div class="cards">

      <div class="card">
        <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=800&q=80" alt="森林">
        <div class="card-body">
          <h3>林间漫步</h3>
          <p>阳光穿过层层枝叶，在苔藓上留下斑驳光影，每一步都是与自然的低语。</p>
        </div>
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=800&q=80" alt="湖泊">
        <div class="card-body">
          <h3>湖畔静思</h3>
          <p>水面如镜，倒映着天空与山峦，时间在这里变得缓慢而温柔。</p>
        </div>
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=800&q=80" alt="山雾">
        <div class="card-body">
          <h3>云雾山谷</h3>
          <p>晨雾轻拂山脊，万物在朦胧中苏醒，仿佛置身一幅流动的水墨画。</p>
        </div>
      </div>

    </div>
  </section>

  <footer>
    © 2026 山野之间 · 自然之息
  </footer>

</body>
</html>
