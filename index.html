<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CyberTech Interface</title>

<style>
/* ===== 基础变量 ===== */
:root {
  --neon-cyan: #00f3ff;
  --neon-pink: #ff00c8;
  --bg-dark: #0a0a14;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Courier New', monospace;
}

body {
  min-height: 100vh;
  background: radial-gradient(circle at top, #0a0a14, #000);
  color: var(--neon-cyan);
  overflow-x: hidden;
  position: relative;
}

/* ===== 动态网格背景 ===== */
.grid-bg {
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,243,255,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,243,255,0.05) 1px, transparent 1px);
  background-size: 60px 60px;
  animation: gridMove 20s linear infinite;
  z-index: -2;
}

@keyframes gridMove {
  0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
  100% { transform: perspective(500px) rotateX(60deg) translateY(60px); }
}

/* ===== 扫描线 ===== */
.scanline {
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    rgba(0,0,0,0.15),
    rgba(0,0,0,0.15) 1px,
    transparent 1px,
    transparent 2px
  );
  pointer-events: none;
  z-index: 999;
}

/* ===== 容器 ===== */
.container {
  max-width: 1100px;
  margin: auto;
  padding: 40px 20px;
  text-align: center;
}

/* ===== 标题 ===== */
h1 {
  font-size: 3rem;
  text-shadow: 0 0 10px var(--neon-cyan);
  animation: glitch 3s infinite;
}

@keyframes glitch {
  0% { transform: translate(0); }
  20% { transform: translate(-2px, 2px); }
  40% { transform: translate(2px, -2px); }
  60% { transform: translate(-2px, 0); }
  100% { transform: translate(0); }
}

.subtitle {
  color: var(--neon-pink);
  margin-bottom: 50px;
  letter-spacing: 4px;
}

/* ===== 卡片 ===== */
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 30px;
}

.card {
  background: rgba(0,0,0,0.6);
  border: 1px solid var(--neon-cyan);
  border-radius: 12px;
  padding: 30px;
  cursor: pointer;
  position: relative;
  transition: 0.4s;
}

.card::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 12px;
  box-shadow: 0 0 20px transparent;
  transition: 0.4s;
}

.card:hover::before {
  box-shadow: 0 0 25px var(--neon-cyan);
}

.card:hover {
  transform: translateY(-10px) scale(1.03);
}

.card h3 {
  color: #fff;
  margin-bottom: 10px;
}

.card p {
  color: rgba(255,255,255,0.7);
  font-size: 0.9rem;
}

/* ===== 底部 ===== */
footer {
  margin-top: 60px;
  font-size: 0.8rem;
  color: rgba(0,243,255,0.5);
}
</style>
</head>

<body>

<div class="grid-bg"></div>
<div class="scanline"></div>

<div class="container">
  <h1>🌀 CYBER SYSTEM</h1>
  <p class="subtitle">/// NEURAL INTERFACE ONLINE ///</p>

  <div class="cards">
    <div class="card" onclick="alert('[系统] 数据链路已建立')">
      <h3>⚡ 神经接入</h3>
      <p>实时同步意识与云端计算单元，延迟低于 0.01ms。</p>
    </div>

    <div class="card" onclick="alert('[系统] 启动战术分析模块')">
      <h3>🛰 战术分析</h3>
      <p>AI 正在预测未来 12 种可能性作战路径。</p>
    </div>

    <div class="card" onclick="alert('[系统] 防火墙已激活')">
      <h3>🔐 防火墙</h3>
      <p>量子级加密防护，抵御所有已知入侵协议。</p>
    </div>
  </div>

  <footer>
    SYSTEM STATUS: <span style="color:#0f0;">ONLINE</span> | VERSION 2.0.26
  </footer>
</div>

</body>
</html>
